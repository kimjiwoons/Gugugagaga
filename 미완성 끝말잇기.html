const BLOCK = new Set(["날뷁"]);      
      
let dict = [];      
let dictSet = new Set();      
let byFirst = new Map();      
let used = new Set();      
let current = null;      
let userTurn = 0;      
let gameOver = false;      
      
const $ = id => document.getElementById(id);      
const statusEl = $("status");      
const historyEl = $("history");      
      
function normalizeWords(arr){      
  const out = [];      
  const s = new Set();      
  for(let x of arr){      
    x = String(x).trim();      
    if(!x || BLOCK.has(x)) continue;      
    if(!/^[가-힣]{2,}$/.test(x)) continue;      
    if(!s.has(x)){      
      s.add(x);      
      out.push(x);      
    }      
  }      
  return out;      
}      
      
function buildDictionary(words){      
  dict = normalizeWords(words);      
  dictSet = new Set(dict);      
  byFirst = new Map();      
      
  for(const w of dict){      
    const c = w[0];      
      
    if(!byFirst.has(c)){      
      byFirst.set(c, []);      
    }      
      
    byFirst.get(c).push(w);      
  }      
      
  $("count").textContent = dict.length.toLocaleString();      
}      
         
    function dueum(c){
  if(!c) return null;

  const code = c.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return null;

  const s = code - 0xAC00;
  const cho = Math.floor(s / 588);
  const jung = Math.floor((s % 588) / 28);
  const jong = s % 28;

  const make = newCho =>
    String.fromCharCode(
      0xAC00 + (newCho * 21 + jung) * 28 + jong
    );

  // 초성 번호:
  // ㄴ = 2, ㄹ = 5, ㅇ = 11

  // ㄴ → ㅇ
  // ㅕ ㅛ ㅠ ㅣ
  // 냬(ㅒ)는 포함 안 됨
  const N_TO_NG = [
    6,   // ㅕ
    12,  // ㅛ
    17,  // ㅠ
    20   // ㅣ
  ];

  if(cho === 2 && N_TO_NG.includes(jung)){
    return make(11);
  }

  if(cho === 5){
    // ㄹ → ㅇ
    // ㅑ ㅕ ㅖ ㅛ ㅠ ㅣ
    const R_TO_NG = [
      2,   // ㅑ
      6,   // ㅕ
      7,   // ㅖ
      12,  // ㅛ
      17,  // ㅠ
      20   // ㅣ
    ];

    if(R_TO_NG.includes(jung)){
      return make(11);
    }

    // ㄹ → ㄴ
    // ㅏ ㅐ ㅗ ㅚ ㅜ ㅡ
    const R_TO_N = [
      0,   // ㅏ
      1,   // ㅐ
      8,   // ㅗ
      11,  // ㅚ
      13,  // ㅜ
      18   // ㅡ
    ];

    if(R_TO_N.includes(jung)){
      return make(2);
    }
  }

  return null;
}  
function allowed(c){      
  const d = dueum(c);      
      
  if(d && d !== c){      
    return [c,d];      
  }      
      
  return [c];      
}      
      
function last(w){      
  return w[w.length - 1];      
}      
      
function canStartWith(word, letter){      
  return allowed(letter).includes(word[0]);      
}      
      
function replies(letter, exclude=null){      
  const out = [];      
      
  for(const c of allowed(letter)){      
    for(const w of (byFirst.get(c) || [])){      
      if(w !== exclude && !used.has(w)){      
        out.push(w);      
      }      
    }      
  }      
      
  return out;      
}      
function countReplies(letter, exclude=null, stop=Infinity){      
  let n = 0;      
      
  for(const c of allowed(letter)){      
    for(const w of (byFirst.get(c) || [])){      
      if(w === exclude || used.has(w)){      
        continue;      
      }      
      
      n++;      
      
      if(n > stop){      
        return n;      
      }      
    }      
  }      
      
  return n;      
}      
      
function addHistory(w, who){      
  if(historyEl.textContent.includes("아직 낸 단어")){      
    historyEl.innerHTML = "";      
  }      
      
  const d = document.createElement("div");      
      
  d.className = who === "나" ? "you" : "ai";      
  d.textContent = `${who}: ${w}`;      
      
  historyEl.prepend(d);      
}      
      
function updateUI(){      
  $("usedCount").textContent =      
    used.size.toLocaleString();      
      
  $("lastWord").textContent =      
    current || "게임 시작";      
      
  if(!current){      
    $("need").textContent = "아무 글자";      
  }else{      
    const a = allowed(last(current));      
      
    $("need").textContent =      
      a.join("/");      
  }      
}      
      
function setStatus(msg, bad=false){      
  statusEl.textContent = msg;      
  statusEl.className =      
    bad ? "bad" : "ok";      
}      
      
function sample(arr,n){      
  if(arr.length <= n){      
    return arr.slice();      
  }      
      
  const out = [];      
  const idx = new Set();      
      
  while(out.length < n){      
    const i =      
      Math.floor(      
        Math.random() * arr.length      
      );      
      
    if(idx.has(i)){      
      continue;      
    }      
      
    idx.add(i);      
    out.push(arr[i]);      
  }      
      
  return out;      
}      
      
function aiMove(){      
  if(gameOver){      
    return;      
  }      
      
  const need =      
    last(current);      
      
  const possible =      
    replies(need);      
      
  if(possible.length === 0){      
    setStatus(      
      "AI가 낼 단어가 없음 — 네 승리 🎉"      
    );      
      
    gameOver = true;      
    return;      
  }      
      
  const cand =      
    sample(possible,120);      
      
  let best =      
    cand[0];      
      
  let bestCount =      
    Infinity;      
      
  for(const w of cand){      
      
    const n =      
      countReplies(      
        last(w),      
        w,      
        bestCount      
      );      
      
    if(n < bestCount){      
      
      best = w;      
      bestCount = n;      
      
      if(n === 0){      
        break;      
      }      
    }      
  }      
      
  used.add(best);      
      
  current = best;      
      
  addHistory(      
    best,      
    "AI"      
  );      
      
  updateUI();      
      
  if(      
    countReplies(      
      last(best),      
      null,      
      1      
    ) === 0      
  ){      
    setStatus(      
      `AI: ${best} — 한방 💀`,      
      true      
    );      
      
    gameOver = true;      
      
  }else{      
      
    setStatus(      
      `AI가 "${best}" 냄`      
    );      
  }      
}      
      
function submitWord(){      
      
  if(gameOver){      
      
    return setStatus(      
      "게임이 끝났음. 초기화 눌러.",      
      true      
    );      
  }      
      
  const w =      
    $("wordInput")      
      .value      
      .trim();      
      
  $("wordInput").value = "";      
      
  if(!w){      
    return;      
  }      
      
  if(BLOCK.has(w)){      
      
    return setStatus(      
      "차단된 단어임.",      
      true      
    );      
  }      
      
  if(!dictSet.has(w)){      
      
    return setStatus(      
      `사전에 "${w}" 없음`,      
      true      
    );      
  }      
      
  if(used.has(w)){      
      
    return setStatus(      
      "이미 나온 단어임.",      
      true      
    );      
  }      
      
  if(      
    current &&      
    !canStartWith(      
      w,      
      last(current)      
    )      
  ){      
      
    return setStatus(      
      `"${allowed(last(current)).join("/")}"로 시작해야 함`,      
      true      
    );      
  }      
      
  if(userTurn === 0){      
      
    const n =      
      countReplies(      
        last(w),      
        w,      
        2      
      );      
      
    if(n === 0){      
      
      return setStatus(      
        "첫턴 한방 금지 💀",      
        true      
      );      
    }      
      
    if(n < 2){      
      
      return setStatus(      
        "첫턴 매너 위반: 상대가 낼 수 있는 단어가 너무 적음",      
        true      
      );      
    }      
  }      
      
  used.add(w);      
      
  current = w;      
      
  userTurn++;      
      
  addHistory(      
    w,      
    "나"      
  );      
      
  updateUI();      
      
  setStatus(      
    `네가 "${w}" 냄`      
  );      
      
  setTimeout(      
    aiMove,      
    220      
  );      
}      
        
  function resetGame(){

  used.clear();
  current = null;
  userTurn = 0;
  gameOver = false;

  historyEl.textContent =
    "아직 낸 단어가 없음.";

  const STARTS = [
    "기",
    "가",
    "자",
    "나",
    "다",
    "마",
    "사",
    "시"
  ];

  const start =
    STARTS[Math.floor(Math.random() * STARTS.length)];

  // 가짜 이전 단어를 만들어서
  // 기존 끝말 판정을 그대로 이용
  current = start;

  $("usedCount").textContent = "0";
  $("lastWord").textContent = `시작 글자: ${start}`;
  $("need").textContent = start;

  setStatus(
    `"${start}"로 시작하는 단어를 내세요`
  );
}

          }else{      
      
            words =      
              Object.keys(j);      
      
          }      
      
        }else{      
      
          words =      
            text.split(      
              /\r?\n|\s+/      
            );      
        }      
      
        buildDictionary([      
          ...EMBEDDED,      
          ...words      
        ]);      
      
        resetGame();      
      
        setStatus(      
          `사전 로드 완료: ${dict.length.toLocaleString()}개`      
        );      
      
      }catch(err){      
      
        setStatus(      
          "사전 파일 읽기 실패: " +      
          err.message,      
          true      
        );      
      }      
      
      e.target.value = "";      
    }      
  );      
      
buildDictionary(      
  EMBEDDED      
);      
      
resetGame();      
      
</script>      </body>
